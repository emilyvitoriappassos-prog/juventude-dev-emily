<h2> preencha o formulario</h2>
<form action="submit" id="formulario">
<label for="nome">nome:</label><br>
<input type="text" id="nome"><br><br> 

<label for="cargo">digite seu cargo:</label><br>
<input type="text" id="nome"><br><br>

<label for="salario">digite seu salario:</label><br>
<input type="number" id="salario" step="0.1"><br><br>
<input type="submit" value="enviar">

</form>
    <script>

        const form = document.querySelector("#formulario")
        form.addEventListener("submit", function(event) {
        event.preventDefault()
        const nome = document.querySelector("#nome").value
        const cargo = document.querySelector("#cargo").value
        const salario = document.querySelector("#salario").value
        alert ("formulario preenchido!" + nome + " " + cargo + " " + salario)

            </script>
